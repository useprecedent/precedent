name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke:packaged-cli

  # Branch protection on main requires the check context "test" (single job name).
  # Matrix legs report as "test-matrix (22)" / "(26)" and do not satisfy that rule.
  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Require all Node versions
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
