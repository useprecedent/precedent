name: Precedent
description: Precedent — comment on PRs when always-on Cursor policy conflicts
author: Precedent
branding:
  icon: git-pull-request
  color: blue
inputs:
  fail-on-unresolved:
    description: Fail the check when unresolved always-on conflicts exist
    required: false
    default: "false"
  token:
    description: GitHub token used to comment on the pull request
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
    - name: Compile and comment
      shell: bash
      env:
        INPUT_FAIL_ON_UNRESOLVED: ${{ inputs.fail-on-unresolved }}
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node --experimental-strip-types "$GITHUB_ACTION_PATH/src/action.ts"
